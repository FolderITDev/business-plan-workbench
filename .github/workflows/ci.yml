name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Prove the suite passes both with the pinned deps installed and with
        # none at all — pandas/MarkItDown-dependent tests skip cleanly.
        deps: [with-deps, no-deps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: matrix.deps == 'with-deps'
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
